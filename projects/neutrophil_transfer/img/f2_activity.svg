<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="ti de">
  <title id="ti">Loss of mitochondrial activity signal after transfer</title>
  <desc id="de">Schematic decay curve: the fluorescent activity signal falls to the detection floor by roughly 20 minutes.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<rect x="70" y="170" width="650" height="20" fill="#ece7f8"/><text class="xs" x="716" y="182" text-anchor="end">detection floor</text><line class="gl" x1="70" y1="48" x2="720" y2="48"/><line class="gl" x1="70" y1="84" x2="720" y2="84"/><line class="gl" x1="70" y1="119" x2="720" y2="119"/><line class="gl" x1="70" y1="154" x2="720" y2="154"/><line class="gl" x1="70" y1="190" x2="720" y2="190"/><path d="M 70.0,48.0 L 151.2,117.1 L 232.5,152.6 L 313.8,170.8 L 395.0,180.1 L 476.2,184.9 L 557.5,187.4 L 638.8,188.7 L 720.0,189.3" fill="none" stroke="#3a3fb8" stroke-width="2.8" stroke-linecap="round"/><circle cx="70.0" cy="48.0" r="3.6" fill="#3a3fb8"/><circle cx="151.2" cy="117.1" r="3.6" fill="#3a3fb8"/><circle cx="232.5" cy="152.6" r="3.6" fill="#3a3fb8"/><circle cx="313.8" cy="170.8" r="3.6" fill="#3a3fb8"/><circle cx="395.0" cy="180.1" r="3.6" fill="#3a3fb8"/><circle cx="476.2" cy="184.9" r="3.6" fill="#3a3fb8"/><circle cx="557.5" cy="187.4" r="3.6" fill="#3a3fb8"/><circle cx="638.8" cy="188.7" r="3.6" fill="#3a3fb8"/><circle cx="720.0" cy="189.3" r="3.6" fill="#3a3fb8"/><line class="dash" x1="395.0" y1="40" x2="395.0" y2="190"/><text class="xs" x="403.0" y="54">activity no longer detectable</text><line class="ax" x1="70" y1="190" x2="720" y2="190"/>
<line class="ax" x1="70.0" y1="190" x2="70.0" y2="195"/>
<text class="xs" x="70.0" y="208" text-anchor="middle">0</text>
<line class="ax" x1="151.25" y1="190" x2="151.25" y2="195"/>
<text class="xs" x="151.25" y="208" text-anchor="middle">5</text>
<line class="ax" x1="232.5" y1="190" x2="232.5" y2="195"/>
<text class="xs" x="232.5" y="208" text-anchor="middle">10</text>
<line class="ax" x1="313.75" y1="190" x2="313.75" y2="195"/>
<text class="xs" x="313.75" y="208" text-anchor="middle">15</text>
<line class="ax" x1="395.0" y1="190" x2="395.0" y2="195"/>
<text class="xs" x="395.0" y="208" text-anchor="middle">20</text>
<line class="ax" x1="476.25" y1="190" x2="476.25" y2="195"/>
<text class="xs" x="476.25" y="208" text-anchor="middle">25</text>
<line class="ax" x1="557.5" y1="190" x2="557.5" y2="195"/>
<text class="xs" x="557.5" y="208" text-anchor="middle">30</text>
<line class="ax" x1="638.75" y1="190" x2="638.75" y2="195"/>
<text class="xs" x="638.75" y="208" text-anchor="middle">35</text>
<line class="ax" x1="720.0" y1="190" x2="720.0" y2="195"/>
<text class="xs" x="720.0" y="208" text-anchor="middle">40</text><text class="xs" x="396" y="226" text-anchor="middle">minutes after transfer</text><text class="xs" x="24" y="119" text-anchor="middle" transform="rotate(-90,24,119)">activity signal</text><text class="xs" x="70" y="24">Schematic. Shape of the observed decay, not measured values.</text>
</svg>
