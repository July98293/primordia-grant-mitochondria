<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="ti de">
  <title id="ti">Planned two by two design</title>
  <desc id="de">Blood is either held in simulated microgravity or static, then either receives mitochondria or does not.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<text class="xs" x="250" y="30" text-anchor="middle">no transfer</text><text class="xs" x="500" y="30" text-anchor="middle">mitochondrial transfer</text><text class="s" x="118" y="90" text-anchor="end">static</text><text class="s" x="118" y="200" text-anchor="end">clinostat</text><rect class="boxw" x="130" y="44" width="240" height="92" rx="12"/>
<text class="s" x="250.0" y="84.0" text-anchor="middle" dominant-baseline="middle">Baseline</text>
<text class="xs" x="250.0" y="120.0" text-anchor="middle" dominant-baseline="middle">reference state</text><rect class="box" x="382" y="44" width="240" height="92" rx="12"/>
<text class="s" x="502.0" y="84.0" text-anchor="middle" dominant-baseline="middle">Transfer only</text>
<text class="xs" x="502.0" y="113.5" text-anchor="middle" dominant-baseline="middle">uptake in normal</text>
<text class="xs" x="502.0" y="126.5" text-anchor="middle" dominant-baseline="middle">gravity</text><rect class="boxw" x="130" y="154" width="240" height="92" rx="12"/>
<text class="s" x="250.0" y="186.5" text-anchor="middle" dominant-baseline="middle">Microgravity</text>
<text class="s" x="250.0" y="201.5" text-anchor="middle" dominant-baseline="middle">only</text>
<text class="xs" x="250.0" y="223.5" text-anchor="middle" dominant-baseline="middle">effect of exposure</text>
<text class="xs" x="250.0" y="236.5" text-anchor="middle" dominant-baseline="middle">alone</text><rect class="box" x="382" y="154" width="240" height="92" rx="12"/>
<text class="s" x="502.0" y="186.5" text-anchor="middle" dominant-baseline="middle">Microgravity +</text>
<text class="s" x="502.0" y="201.5" text-anchor="middle" dominant-baseline="middle">transfer</text>
<text class="xs" x="502.0" y="223.5" text-anchor="middle" dominant-baseline="middle">the condition of</text>
<text class="xs" x="502.0" y="236.5" text-anchor="middle" dominant-baseline="middle">interest</text><text class="xs" x="12" y="282">Each arm is read out for uptake and for how long activity persists.</text>
</svg>
