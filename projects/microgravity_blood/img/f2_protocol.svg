<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-labelledby="ti de">
  <title id="ti">Planned protocol order</title>
  <desc id="de">Draw blood, expose to simulated microgravity, perform the transfer, then read out.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<rect class="box" x="12" y="28" width="170" height="86" rx="12"/>
<text class="s" x="97.0" y="71.0" text-anchor="middle" dominant-baseline="middle">Draw blood</text>
<rect class="box" x="202" y="28" width="170" height="86" rx="12"/>
<text class="s" x="287.0" y="57.5" text-anchor="middle" dominant-baseline="middle">Clinostat</text>
<text class="s" x="287.0" y="72.5" text-anchor="middle" dominant-baseline="middle">exposure</text>
<text class="xs" x="287.0" y="98.0" text-anchor="middle" dominant-baseline="middle">fixed duration</text>
<path class="arr" d="M 184,71.0 L 196,71.0"/>
<rect class="box" x="392" y="28" width="170" height="86" rx="12"/>
<text class="s" x="477.0" y="65.0" text-anchor="middle" dominant-baseline="middle">Transfer</text>
<text class="xs" x="477.0" y="98.0" text-anchor="middle" dominant-baseline="middle">in blood, as in route B</text>
<path class="arr" d="M 374,71.0 L 386,71.0"/>
<rect class="box" x="582" y="28" width="170" height="86" rx="12"/>
<text class="s" x="667.0" y="65.0" text-anchor="middle" dominant-baseline="middle">Read out</text>
<text class="xs" x="667.0" y="98.0" text-anchor="middle" dominant-baseline="middle">uptake and persistence</text>
<path class="arr" d="M 564,71.0 L 576,71.0"/><text class="xs" x="12" y="150">Blocked on access to a calibrated clinostat; a self-built unit would not be reproducible.</text>
</svg>
