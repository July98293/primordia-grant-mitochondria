<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-labelledby="ti de">
  <title id="ti">Group layout: two arms against four conjugate conditions</title>
  <desc id="de">Healthy and irradiated PBMC each receive four conditions: two targeting antibodies, a respiration-blocked control and a no-antibody control.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<text class="t" x="212" y="20.0" text-anchor="middle" dominant-baseline="middle">α-CD11a</text>
<text class="xs" x="212" y="37.0" text-anchor="middle" dominant-baseline="middle">targeting</text>
<text class="t" x="367" y="20.0" text-anchor="middle" dominant-baseline="middle">α-CD11c</text>
<text class="xs" x="367" y="37.0" text-anchor="middle" dominant-baseline="middle">targeting</text>
<text class="t" x="522" y="20.0" text-anchor="middle" dominant-baseline="middle">Rot / AA</text>
<text class="xs" x="522" y="37.0" text-anchor="middle" dominant-baseline="middle">respiration blocked</text>
<text class="t" x="677" y="20.0" text-anchor="middle" dominant-baseline="middle">Control</text>
<text class="xs" x="677" y="37.0" text-anchor="middle" dominant-baseline="middle">no antibody</text>
<text class="s" x="128" y="88" text-anchor="end" dominant-baseline="middle">Healthy (H)</text>
<rect class="box" x="140" y="52" width="145" height="72" rx="12"/>
<text class="s" x="212.5" y="82.0" text-anchor="middle" dominant-baseline="middle">10 wells</text>
<text class="xs" x="212.5" y="108.0" text-anchor="middle" dominant-baseline="middle">100,000 cells each</text>
<rect class="box" x="295" y="52" width="145" height="72" rx="12"/>
<text class="s" x="367.5" y="82.0" text-anchor="middle" dominant-baseline="middle">10 wells</text>
<text class="xs" x="367.5" y="108.0" text-anchor="middle" dominant-baseline="middle">100,000 cells each</text>
<rect class="boxw" x="450" y="52" width="145" height="72" rx="12"/>
<text class="s" x="522.5" y="82.0" text-anchor="middle" dominant-baseline="middle">10 wells</text>
<text class="xs" x="522.5" y="108.0" text-anchor="middle" dominant-baseline="middle">100,000 cells each</text>
<rect class="boxw" x="605" y="52" width="145" height="72" rx="12"/>
<text class="s" x="677.5" y="82.0" text-anchor="middle" dominant-baseline="middle">10 wells</text>
<text class="xs" x="677.5" y="108.0" text-anchor="middle" dominant-baseline="middle">100,000 cells each</text>
<text class="s" x="128" y="180" text-anchor="end" dominant-baseline="middle">Irradiated (I)</text>
<rect class="box" x="140" y="144" width="145" height="72" rx="12"/>
<text class="s" x="212.5" y="174.0" text-anchor="middle" dominant-baseline="middle">10 wells</text>
<text class="xs" x="212.5" y="200.0" text-anchor="middle" dominant-baseline="middle">100,000 cells each</text>
<rect class="box" x="295" y="144" width="145" height="72" rx="12"/>
<text class="s" x="367.5" y="174.0" text-anchor="middle" dominant-baseline="middle">10 wells</text>
<text class="xs" x="367.5" y="200.0" text-anchor="middle" dominant-baseline="middle">100,000 cells each</text>
<rect class="boxw" x="450" y="144" width="145" height="72" rx="12"/>
<text class="s" x="522.5" y="174.0" text-anchor="middle" dominant-baseline="middle">10 wells</text>
<text class="xs" x="522.5" y="200.0" text-anchor="middle" dominant-baseline="middle">100,000 cells each</text>
<rect class="boxw" x="605" y="144" width="145" height="72" rx="12"/>
<text class="s" x="677.5" y="174.0" text-anchor="middle" dominant-baseline="middle">10 wells</text>
<text class="xs" x="677.5" y="200.0" text-anchor="middle" dominant-baseline="middle">100,000 cells each</text>
<text class="xs" x="14" y="258">Eight groups in V-bottom 96-well plates. 15 to 20 µL of mitochondrial suspension per well, delivered in 150 µL cold PBS.</text>
</svg>
