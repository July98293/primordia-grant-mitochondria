<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 176" role="img" aria-labelledby="ti de">
  <title id="ti">Transfer workflow for the healthy against irradiated arm</title>
  <desc id="de">Mitochondria are isolated from BJ fibroblasts, labelled, co-incubated with PBMC for 90 minutes, then read by flow cytometry.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<rect class="box" x="14" y="26" width="130" height="92" rx="12"/>
<text class="s" x="79.0" y="66.0" text-anchor="middle" dominant-baseline="middle">BJ fibroblasts</text>
<text class="xs" x="79.0" y="102.0" text-anchor="middle" dominant-baseline="middle">mitochondrial donor</text>
<rect class="box" x="162" y="26" width="130" height="92" rx="12"/>
<text class="s" x="227.0" y="58.5" text-anchor="middle" dominant-baseline="middle">Isolate</text>
<text class="s" x="227.0" y="73.5" text-anchor="middle" dominant-baseline="middle">mitochondria</text>
<text class="xs" x="227.0" y="102.0" text-anchor="middle" dominant-baseline="middle">500 µL available</text>
<path class="arr" d="M 146,72.0 L 156,72.0"/>
<rect class="box" x="310" y="26" width="130" height="92" rx="12"/>
<text class="s" x="375.0" y="66.0" text-anchor="middle" dominant-baseline="middle">Label</text>
<text class="xs" x="375.0" y="102.0" text-anchor="middle" dominant-baseline="middle">AF647, 647-DBCO</text>
<path class="arr" d="M 294,72.0 L 304,72.0"/>
<rect class="box" x="458" y="26" width="130" height="92" rx="12"/>
<text class="s" x="523.0" y="66.0" text-anchor="middle" dominant-baseline="middle">Co-incubate</text>
<text class="xs" x="523.0" y="95.5" text-anchor="middle" dominant-baseline="middle">90 min, 37 °C, 5%</text>
<text class="xs" x="523.0" y="108.5" text-anchor="middle" dominant-baseline="middle">CO₂</text>
<path class="arr" d="M 442,72.0 L 452,72.0"/>
<rect class="box" x="606" y="26" width="130" height="92" rx="12"/>
<text class="s" x="671.0" y="66.0" text-anchor="middle" dominant-baseline="middle">Flow cytometry</text>
<text class="xs" x="671.0" y="102.0" text-anchor="middle" dominant-baseline="middle">analysed in FlowJo</text>
<path class="arr" d="M 590,72.0 L 600,72.0"/><text class="xs" x="14" y="150">Washed two to three times in cold PBS between co-incubation and staining. Non-transfer controls are handled identically.</text>
</svg>
