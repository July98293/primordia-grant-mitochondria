<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="ti de">
  <title id="ti">Viability of the three cell preparations used</title>
  <desc id="de">BJ donor fibroblasts at 73 percent, healthy PBMC at 63 percent and irradiated PBMC at 65 percent.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<text class="s" x="250" y="32">BJ fibroblasts (donor)</text>
<text class="xs" x="636" y="32" text-anchor="end">2.4 × 10⁶/mL</text>
<rect x="250" y="40" width="330" height="26" rx="13.0" fill="#ece7f8"/>
<rect x="250" y="40" width="240.9" height="26" rx="13.0" fill="#7d5ff0"/>
<text class="num" x="500.9" y="53.0" dominant-baseline="middle">73%</text><text class="s" x="250" y="104">Healthy PBMC (H)</text>
<text class="xs" x="636" y="104" text-anchor="end">1.23 × 10⁶/mL</text>
<rect x="250" y="112" width="330" height="26" rx="13.0" fill="#ece7f8"/>
<rect x="250" y="112" width="207.9" height="26" rx="13.0" fill="#3f8fd4"/>
<text class="num" x="467.9" y="125.0" dominant-baseline="middle">63%</text><text class="s" x="250" y="176">Irradiated PBMC (I)</text>
<text class="xs" x="636" y="176" text-anchor="end">7.26 × 10⁶/mL</text>
<rect x="250" y="184" width="330" height="26" rx="13.0" fill="#ece7f8"/>
<rect x="250" y="184" width="214.5" height="26" rx="13.0" fill="#3f8fd4"/>
<text class="num" x="474.5" y="197.0" dominant-baseline="middle">65%</text><line class="ax" x1="250" y1="238" x2="580" y2="238"/>
<line class="ax" x1="250.0" y1="238" x2="250.0" y2="243"/>
<text class="xs" x="250.0" y="256" text-anchor="middle">0%</text>
<line class="ax" x1="332.5" y1="238" x2="332.5" y2="243"/>
<text class="xs" x="332.5" y="256" text-anchor="middle">25%</text>
<line class="ax" x1="415.0" y1="238" x2="415.0" y2="243"/>
<text class="xs" x="415.0" y="256" text-anchor="middle">50%</text>
<line class="ax" x1="497.5" y1="238" x2="497.5" y2="243"/>
<text class="xs" x="497.5" y="256" text-anchor="middle">75%</text>
<line class="ax" x1="580.0" y1="238" x2="580.0" y2="243"/>
<text class="xs" x="580.0" y="256" text-anchor="middle">100%</text><text class="xs" x="415" y="278" text-anchor="middle">viability at counting</text>
</svg>
