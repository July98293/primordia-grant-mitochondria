<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" role="img" aria-labelledby="ti de">
  <title id="ti">Structure of the review</title>
  <desc id="de">Five parts: ethical, environmental and market assessment, a dose modeling proposal and a case for revisiting IVF.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<rect class="box" x="12" y="40" width="139" height="92" rx="12"/>
<text class="s" x="81.5" y="78.5" text-anchor="middle" dominant-baseline="middle">Ethical</text>
<text class="s" x="81.5" y="93.5" text-anchor="middle" dominant-baseline="middle">assessment</text>
<rect class="box" x="163" y="40" width="139" height="92" rx="12"/>
<text class="s" x="232.5" y="78.5" text-anchor="middle" dominant-baseline="middle">Environmental</text>
<text class="s" x="232.5" y="93.5" text-anchor="middle" dominant-baseline="middle">impact</text>
<rect class="box" x="314" y="40" width="139" height="92" rx="12"/>
<text class="s" x="383.5" y="78.5" text-anchor="middle" dominant-baseline="middle">Market</text>
<text class="s" x="383.5" y="93.5" text-anchor="middle" dominant-baseline="middle">assessment</text>
<rect class="boxw" x="465" y="40" width="139" height="92" rx="12"/>
<text class="s" x="534.5" y="78.5" text-anchor="middle" dominant-baseline="middle">Dose modeling</text>
<text class="s" x="534.5" y="93.5" text-anchor="middle" dominant-baseline="middle">proposal</text>
<rect class="boxw" x="616" y="40" width="139" height="92" rx="12"/>
<text class="s" x="685.5" y="78.5" text-anchor="middle" dominant-baseline="middle">Case for IVF</text>
<text class="s" x="685.5" y="93.5" text-anchor="middle" dominant-baseline="middle">review</text>
<text class="xs" x="12" y="24">Five parts, written as one argument rather than five notes.</text>
<path class="dash" d="M 466,142 L 466,158 L 692,158 L 692,142"/>
<text class="xs" x="579" y="176" text-anchor="middle">added after expert review</text>
</svg>
