<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="ti de">
  <title id="ti">Published protocol compared with the protocol used in the lab</title>
  <desc id="de">Three steps differ: how cells are broken open, how much filtration is used, and the buffer.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<text class="t" x="12" y="24">As described in the literature</text><rect class="box" x="12" y="36" width="232" height="76" rx="12"/>
<text class="s" x="128.0" y="68.0" text-anchor="middle" dominant-baseline="middle">Break cells</text>
<text class="xs" x="128.0" y="96.0" text-anchor="middle" dominant-baseline="middle">fine needle</text>
<rect class="box" x="266" y="36" width="232" height="76" rx="12"/>
<text class="s" x="382.0" y="68.0" text-anchor="middle" dominant-baseline="middle">Filter</text>
<text class="xs" x="382.0" y="96.0" text-anchor="middle" dominant-baseline="middle">repeated</text>
<path class="arr" d="M 246,74.0 L 260,74.0"/>
<rect class="box" x="520" y="36" width="232" height="76" rx="12"/>
<text class="s" x="636.0" y="74.0" text-anchor="middle" dominant-baseline="middle">Standard buffer</text>
<path class="arr" d="M 500,74.0 L 514,74.0"/><text class="t" x="12" y="164">As performed in the lab</text><rect class="box" x="12" y="176" width="232" height="76" rx="12"/>
<text class="s" x="128.0" y="208.0" text-anchor="middle" dominant-baseline="middle">Break cells</text>
<text class="xs" x="128.0" y="236.0" text-anchor="middle" dominant-baseline="middle">sonication</text>
<rect class="box" x="266" y="176" width="232" height="76" rx="12"/>
<text class="s" x="382.0" y="208.0" text-anchor="middle" dominant-baseline="middle">Filter</text>
<text class="xs" x="382.0" y="236.0" text-anchor="middle" dominant-baseline="middle">minimal, to limit damage</text>
<path class="arr" d="M 246,214.0 L 260,214.0"/>
<rect class="box" x="520" y="176" width="232" height="76" rx="12"/>
<text class="s" x="636.0" y="214.0" text-anchor="middle" dominant-baseline="middle">Different buffer</text>
<path class="arr" d="M 500,214.0 L 514,214.0"/><text class="xs" x="12" y="288">Each change reduces mechanical stress on the mitochondria. None of it is stated in the papers.</text>
</svg>
