<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="ti de">
  <title id="ti">The two mitochondrial gene families that carry the signal</title>
  <desc id="de">Oxidative phosphorylation genes and mitochondrial ribosome genes are the families whose coordinated movement produces the result.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<rect class="box" x="60" y="46" width="250" height="86" rx="12"/>
<text class="s" x="185.0" y="75.5" text-anchor="middle" dominant-baseline="middle">Oxidative</text>
<text class="s" x="185.0" y="90.5" text-anchor="middle" dominant-baseline="middle">phosphorylation</text>
<text class="xs" x="185.0" y="116.0" text-anchor="middle" dominant-baseline="middle">the respiratory chain itself</text><rect class="box" x="60" y="148" width="250" height="86" rx="12"/>
<text class="s" x="185.0" y="185.0" text-anchor="middle" dominant-baseline="middle">Mitochondrial ribosome</text>
<text class="xs" x="185.0" y="218.0" text-anchor="middle" dominant-baseline="middle">the machinery that builds it</text><path class="arr" d="M 310,89 L 404,120"/><path class="arr" d="M 310,191 L 404,160"/><rect class="boxw" x="416" y="92" width="200" height="96" rx="12"/>
<text class="s" x="516.0" y="134.0" text-anchor="middle" dominant-baseline="middle">Coordinated shift</text>
<text class="xs" x="516.0" y="172.0" text-anchor="middle" dominant-baseline="middle">scored per cell type</text><text class="xs" x="12" y="24">Both families move together, which is what makes a modest change readable.</text>
</svg>
