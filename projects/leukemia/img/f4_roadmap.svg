<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="ti de">
  <title id="ti">Disease datasets feeding a shared model</title>
  <desc id="de">One completed disease comparison and four queued ones feed a shared model of mitochondrial perturbation.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<rect class="box" x="12" y="30" width="220" height="42" rx="10"/>
<text class="s" x="122.0" y="51.0" text-anchor="middle" dominant-baseline="middle">Leukemia (AML)</text>
<text class="xs" x="244" y="51" dominant-baseline="middle">complete</text>
<line x1="340" y1="51" x2="404" y2="51" stroke="#3a3fb8" stroke-width="2"/>
<rect class="boxw" x="12" y="82" width="220" height="42" rx="10"/>
<text class="s" x="122.0" y="103.0" text-anchor="middle" dominant-baseline="middle">Microgravity</text>
<text class="xs" x="244" y="103" dominant-baseline="middle">queued</text>
<line x1="340" y1="103" x2="404" y2="103" stroke="#3a3fb8" stroke-width="2"/>
<rect class="boxw" x="12" y="134" width="220" height="42" rx="10"/>
<text class="s" x="122.0" y="155.0" text-anchor="middle" dominant-baseline="middle">Infarct</text>
<text class="xs" x="244" y="155" dominant-baseline="middle">queued</text>
<line x1="340" y1="155" x2="404" y2="155" stroke="#3a3fb8" stroke-width="2"/>
<rect class="boxw" x="12" y="186" width="220" height="42" rx="10"/>
<text class="s" x="122.0" y="207.0" text-anchor="middle" dominant-baseline="middle">Obesity</text>
<text class="xs" x="244" y="207" dominant-baseline="middle">queued</text>
<line x1="340" y1="207" x2="404" y2="207" stroke="#3a3fb8" stroke-width="2"/>
<rect class="boxw" x="12" y="238" width="220" height="42" rx="10"/>
<text class="s" x="122.0" y="259.0" text-anchor="middle" dominant-baseline="middle">PCOS</text>
<text class="xs" x="244" y="259" dominant-baseline="middle">queued</text>
<line x1="340" y1="259" x2="404" y2="259" stroke="#3a3fb8" stroke-width="2"/>
<line x1="404" y1="51" x2="404" y2="259" stroke="#3a3fb8" stroke-width="2"/>
<path class="arr" d="M 404,155 L 448,155"/>
<rect class="box" x="460" y="100" width="180" height="110" rx="12"/>
<text class="s" x="550.0" y="140.0" text-anchor="middle" dominant-baseline="middle">Shared</text>
<text class="s" x="550.0" y="155.0" text-anchor="middle" dominant-baseline="middle">mitochondrial</text>
<text class="s" x="550.0" y="170.0" text-anchor="middle" dominant-baseline="middle">response model</text>
<path class="arr" d="M 640,155 L 684,155"/>
<text class="xs" x="722" y="147.5" text-anchor="middle" dominant-baseline="middle">per-organelle</text>
<text class="xs" x="722" y="162.5" text-anchor="middle" dominant-baseline="middle">predictions</text>
</svg>
