<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" role="img" aria-labelledby="ti de">
  <title id="ti">Disease comparison pipeline</title>
  <desc id="de">Datasets are harmonised, aggregated per cell type, scored against mitochondrial gene sets, then tested.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<rect class="box" x="14" y="26" width="130" height="92" rx="12"/>
<text class="s" x="79.0" y="64.5" text-anchor="middle" dominant-baseline="middle">Patient and</text>
<text class="s" x="79.0" y="79.5" text-anchor="middle" dominant-baseline="middle">donor datasets</text>
<rect class="box" x="162" y="26" width="130" height="92" rx="12"/>
<text class="s" x="227.0" y="66.0" text-anchor="middle" dominant-baseline="middle">Harmonise</text>
<text class="xs" x="227.0" y="95.5" text-anchor="middle" dominant-baseline="middle">batch and</text>
<text class="xs" x="227.0" y="108.5" text-anchor="middle" dominant-baseline="middle">normalisation</text>
<path class="arr" d="M 146,72.0 L 156,72.0"/>
<rect class="box" x="310" y="26" width="130" height="92" rx="12"/>
<text class="s" x="375.0" y="66.0" text-anchor="middle" dominant-baseline="middle">Pseudobulk</text>
<text class="xs" x="375.0" y="95.5" text-anchor="middle" dominant-baseline="middle">per cell type, per</text>
<text class="xs" x="375.0" y="108.5" text-anchor="middle" dominant-baseline="middle">donor</text>
<path class="arr" d="M 294,72.0 L 304,72.0"/>
<rect class="box" x="458" y="26" width="130" height="92" rx="12"/>
<text class="s" x="523.0" y="58.5" text-anchor="middle" dominant-baseline="middle">Mitochondrial</text>
<text class="s" x="523.0" y="73.5" text-anchor="middle" dominant-baseline="middle">gene sets</text>
<text class="xs" x="523.0" y="102.0" text-anchor="middle" dominant-baseline="middle">OXPHOS, mitoribosome</text>
<path class="arr" d="M 442,72.0 L 452,72.0"/>
<rect class="box" x="606" y="26" width="130" height="92" rx="12"/>
<text class="s" x="671.0" y="64.5" text-anchor="middle" dominant-baseline="middle">Test per cell</text>
<text class="s" x="671.0" y="79.5" text-anchor="middle" dominant-baseline="middle">type</text>
<path class="arr" d="M 590,72.0 L 600,72.0"/><text class="xs" x="12" y="158">Batch structure is the limiting factor: the datasets come from different studies and conditions.</text><text class="xs" x="12" y="176">Run across 10 cell groups.</text>
</svg>
